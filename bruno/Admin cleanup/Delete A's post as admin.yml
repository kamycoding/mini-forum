info:
  name: Delete A's post as admin
  type: http
  seq: 3

http:
  method: DELETE
  url: "{{base_url}}/api/posts/{{post_id}}/"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Token {{token_admin}}
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Returns HTTP 204", function () {
            expect(res.getStatus()).to.equal(204);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
