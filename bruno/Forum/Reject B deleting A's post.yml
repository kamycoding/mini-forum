info:
  name: Reject B deleting A's post
  type: http
  seq: 7

http:
  method: DELETE
  url: "{{base_url}}/api/posts/{{post_id}}/"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Token {{token_user_b}}
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Returns HTTP 403", function () {
            expect(res.getStatus()).to.equal(403);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
