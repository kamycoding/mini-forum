info:
  name: List comments as A
  type: http
  seq: 10

http:
  method: GET
  url: "{{base_url}}/api/comments/"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Token {{token_user_a}}
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Returns HTTP 200", function () {
            expect(res.getStatus()).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
