info:
  name: List posts as B
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/api/posts/"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Token {{token_user_b}}
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Returns HTTP 200", function () {
            expect(res.getStatus()).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
