info:
  name: Update post as A
  type: http
  seq: 8

http:
  method: PUT
  url: "{{base_url}}/api/posts/{{post_id}}/"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Token {{token_user_a}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "title": "Updated forum post",
        "content": "A revised introduction."
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Returns HTTP 200", function () {
            expect(res.getStatus()).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
