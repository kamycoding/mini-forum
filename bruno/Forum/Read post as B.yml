info:
  name: Read post as B
  type: http
  seq: 5

http:
  method: GET
  url: "{{base_url}}/api/posts/{{post_id}}/"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Token {{token_user_b}}
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Returns HTTP 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("Returns the requested object", function () {
            expect(res.getBody().id).to.eql(Number(bru.getVar("post_id")));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
