info:
  name: Reject anonymous post list
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/api/posts/"
  headers:
    - name: Accept
      value: application/json
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Returns HTTP 401", function () {
            expect(res.getStatus()).to.equal(401);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
